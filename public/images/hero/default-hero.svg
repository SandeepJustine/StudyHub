<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2D5A;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="white" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <rect width="1920" height="600" fill="url(#dots)"/>
  <circle cx="1600" cy="100" r="300" fill="white" opacity="0.03"/>
  <circle cx="300" cy="500" r="200" fill="white" opacity="0.03"/>
</svg>
