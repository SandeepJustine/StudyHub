<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="600" viewBox="0 0 1920 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B3D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A2D5A;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1920" height="600" fill="url(#bg)"/>
  <rect width="1920" height="600" fill="url(#dots)"/>
  <!-- Abstract pricing cards -->
  <rect x="600" y="150" width="180" height="250" rx="10" fill="white" opacity="0.05"/>
  <rect x="850" y="100" width="200" height="300" rx="10" fill="white" opacity="0.08"/>
  <rect x="1120" y="150" width="180" height="250" rx="10" fill="white" opacity="0.05"/>
  <!-- Dollar signs -->
  <text x="680" y="200" font-size="40" fill="white" opacity="0.15">MWK</text>
  <text x="930" y="180" font-size="40" fill="white" opacity="0.15">MWK</text>
  <text x="1200" y="200" font-size="40" fill="white" opacity="0.15">MWK</text>
</svg>
