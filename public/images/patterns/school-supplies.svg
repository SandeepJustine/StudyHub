<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="supplies" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Scissors -->
      <g transform="translate(8, 8) rotate(30)" opacity="0.09">
        <circle cx="4" cy="4" r="3" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="14" cy="4" r="3" fill="none" stroke="currentColor" stroke-width="1"/>
        <line x1="7" y1="4" x2="11" y2="4" stroke="currentColor" stroke-width="1"/>
        <line x1="4" y1="7" x2="3" y2="12" stroke="currentColor" stroke-width="1"/>
        <line x1="14" y1="7" x2="15" y2="12" stroke="currentColor" stroke-width="1"/>
      </g>
      <!-- Eraser -->
      <g transform="translate(55, 10) rotate(-15)" opacity="0.08">
        <rect x="0" y="0" width="14" height="6" rx="1.5" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="2" y="1" width="10" height="4" rx="1" fill="currentColor" opacity="0.2"/>
      </g>
      <!-- Paperclip -->
      <g transform="translate(30, 50)" opacity="0.08">
        <path d="M8 2 L8 18 Q8 22 5 22 Q2 22 2 19 L2 6 Q2 3 5 3 Q8 3 8 6 L8 16" fill="none" stroke="currentColor" stroke-width="1"/>
      </g>
      <!-- Pushpin -->
      <g transform="translate(75, 40)" opacity="0.08">
        <circle cx="6" cy="6" r="3" fill="none" stroke="currentColor" stroke-width="1"/>
        <line x1="6" y1="9" x2="6" y2="16" stroke="currentColor" stroke-width="0.8"/>
        <circle cx="6" cy="6" r="1" fill="#E63946" opacity="0.3"/>
      </g>
      <!-- Stapler -->
      <g transform="translate(8, 70)" opacity="0.08">
        <rect x="0" y="4" width="16" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="4" y="0" width="8" height="4" rx="0.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <rect x="0" y="9" width="4" height="2" rx="0.5" fill="none" stroke="currentColor" stroke-width="0.5"/>
      </g>
      <!-- Magnifying Glass -->
      <g transform="translate(55, 70) rotate(-10)" opacity="0.08">
        <circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1"/>
        <line x1="12" y1="12" x2="17" y2="17" stroke="currentColor" stroke-width="1.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#supplies)"/>
</svg>
