<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <pattern id="campus" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- School Building -->
      <g transform="translate(5, 5)" opacity="0.08">
        <rect x="0" y="20" width="35" height="25" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="5" y="25" width="8" height="8" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <rect x="16" y="25" width="8" height="8" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <rect x="8" y="38" width="20" height="7" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <!-- Roof (Triangle) -->
        <polygon points="-3,20 17.5,10 38,20" fill="none" stroke="currentColor" stroke-width="1"/>
        <!-- Flag -->
        <line x1="17.5" y1="10" x2="17.5" y2="2" stroke="currentColor" stroke-width="0.5"/>
        <polygon points="17.5,2 24,4 17.5,6" fill="#E63946" opacity="0.3"/>
      </g>
      <!-- Tree -->
      <g transform="translate(55, 15)" opacity="0.06">
        <rect x="8" y="25" width="3" height="10" fill="currentColor"/>
        <circle cx="9.5" cy="20" r="10" fill="none" stroke="currentColor" stroke-width="1"/>
      </g>
      <!-- Graduation Cap -->
      <g transform="translate(60, 60)" opacity="0.08">
        <path d="M8 12 L0 16 L8 20 L16 16 L8 12Z" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="6" y="20" width="4" height="4" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <line x1="8" y1="16" x2="8" y2="20" stroke="currentColor" stroke-width="0.5"/>
        <path d="M0 16 L8 20 L16 16" fill="none" stroke="#E63946" stroke-width="0.5" opacity="0.5"/>
      </g>
      <!-- Book Stack -->
      <g transform="translate(5, 65)" opacity="0.08">
        <rect x="0" y="15" width="20" height="3" rx="0.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <rect x="1" y="12" width="18" height="3" rx="0.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <rect x="2" y="9" width="16" height="3" rx="0.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
      </g>
    </pattern>
  </defs>
  <rect width="100" height="100" fill="url(#campus)"/>
</svg>
