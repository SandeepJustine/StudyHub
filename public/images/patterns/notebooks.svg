<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="notebooks" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Notebook 1 -->
      <g transform="translate(5, 5) rotate(-10)" opacity="0.10">
        <rect x="0" y="0" width="22" height="28" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <line x1="5" y1="8" x2="17" y2="8" stroke="currentColor" stroke-width="0.8"/>
        <line x1="5" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="0.8"/>
        <line x1="5" y1="16" x2="14" y2="16" stroke="currentColor" stroke-width="0.8"/>
        <line x1="5" y1="20" x2="17" y2="20" stroke="currentColor" stroke-width="0.8"/>
        <circle cx="11" cy="24" r="2" fill="currentColor" opacity="0.5"/>
        <line x1="3" y1="0" x2="3" y2="28" stroke="#E63946" stroke-width="1" opacity="0.3"/>
      </g>
      <!-- Notebook 2 -->
      <g transform="translate(50, 45) rotate(15)" opacity="0.08">
        <rect x="0" y="0" width="18" height="24" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <line x1="4" y1="7" x2="14" y2="7" stroke="currentColor" stroke-width="0.8"/>
        <line x1="4" y1="11" x2="14" y2="11" stroke="currentColor" stroke-width="0.8"/>
        <line x1="4" y1="15" x2="12" y2="15" stroke="currentColor" stroke-width="0.8"/>
        <line x1="4" y1="19" x2="14" y2="19" stroke="currentColor" stroke-width="0.8"/>
      </g>
    </pattern>
  </defs>
  <rect width="80" height="80" fill="url(#notebooks)"/>
</svg>
