<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="rulers" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Ruler 1 (Horizontal) -->
      <g transform="translate(5, 10)" opacity="0.10">
        <rect x="0" y="0" width="40" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1"/>
        <line x1="10" y1="0" x2="10" y2="3" stroke="currentColor" stroke-width="0.8"/>
        <line x1="15" y1="0" x2="15" y2="5" stroke="currentColor" stroke-width="0.8"/>
        <line x1="20" y1="0" x2="20" y2="3" stroke="currentColor" stroke-width="0.8"/>
        <line x1="25" y1="0" x2="25" y2="5" stroke="currentColor" stroke-width="0.8"/>
        <line x1="30" y1="0" x2="30" y2="3" stroke="currentColor" stroke-width="0.8"/>
        <line x1="35" y1="0" x2="35" y2="5" stroke="currentColor" stroke-width="0.8"/>
      </g>
      <!-- Ruler 2 (Triangle) -->
      <g transform="translate(55, 50) rotate(-20)" opacity="0.08">
        <polygon points="0,25 25,25 12.5,0" fill="none" stroke="currentColor" stroke-width="1"/>
        <polygon points="3,22 22,22 12.5,3" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <line x1="6.25" y1="14" x2="18.75" y2="14" stroke="currentColor" stroke-width="0.5"/>
      </g>
      <!-- Ruler 3 (Protractor) -->
      <g transform="translate(10, 55)" opacity="0.07">
        <path d="M5 20 A15 15 0 0 1 35 20" fill="none" stroke="currentColor" stroke-width="1"/>
        <line x1="5" y1="20" x2="35" y2="20" stroke="currentColor" stroke-width="0.5"/>
        <line x1="20" y1="20" x2="20" y2="5" stroke="currentColor" stroke-width="0.5"/>
        <line x1="20" y1="20" x2="10" y2="7" stroke="currentColor" stroke-width="0.3"/>
        <line x1="20" y1="20" x2="30" y2="7" stroke="currentColor" stroke-width="0.3"/>
      </g>
    </pattern>
  </defs>
  <rect width="80" height="80" fill="url(#rulers)"/>
</svg>
