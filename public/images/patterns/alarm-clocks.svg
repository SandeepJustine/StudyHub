<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <pattern id="clocks" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Alarm Clock 1 -->
      <g transform="translate(8, 8)" opacity="0.10">
        <circle cx="14" cy="16" r="12" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <circle cx="14" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <line x1="14" y1="16" x2="14" y2="10" stroke="currentColor" stroke-width="1.5"/>
        <line x1="14" y1="16" x2="19" y2="16" stroke="currentColor" stroke-width="1"/>
        <circle cx="14" cy="16" r="1" fill="currentColor"/>
        <!-- Bell -->
        <path d="M10 6 Q8 2 14 2 Q20 2 18 6" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="7" cy="4" r="2" fill="#E63946" opacity="0.3"/>
        <circle cx="21" cy="4" r="2" fill="#E63946" opacity="0.3"/>
        <!-- Legs -->
        <line x1="8" y1="28" x2="6" y2="31" stroke="currentColor" stroke-width="1"/>
        <line x1="20" y1="28" x2="22" y2="31" stroke="currentColor" stroke-width="1"/>
      </g>
      <!-- Alarm Clock 2 -->
      <g transform="translate(50, 48)" opacity="0.08">
        <circle cx="10" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.2"/>
        <line x1="10" y1="12" x2="10" y2="7" stroke="currentColor" stroke-width="1.2"/>
        <line x1="10" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="0.8"/>
        <path d="M6 4 Q5 1 10 1 Q15 1 14 4" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <line x1="5" y1="22" x2="4" y2="25" stroke="currentColor" stroke-width="0.8"/>
        <line x1="15" y1="22" x2="16" y2="25" stroke="currentColor" stroke-width="0.8"/>
      </g>
    </pattern>
  </defs>
  <rect width="80" height="80" fill="url(#clocks)"/>
</svg>
