<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <pattern id="academic" x="0" y="0" width="200" height="60" patternUnits="userSpaceOnUse">
      <!-- Laurel/Decoration -->
      <g opacity="0.08">
        <path d="M20 30 Q30 20 40 30 Q50 40 60 30" fill="none" stroke="currentColor" stroke-width="1"/>
        <path d="M140 30 Q150 20 160 30 Q170 40 180 30" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="100" cy="30" r="8" fill="none" stroke="currentColor" stroke-width="1"/>
        <circle cx="100" cy="30" r="3" fill="currentColor" opacity="0.3"/>
        <!-- Lines -->
        <line x1="70" y1="30" x2="90" y2="30" stroke="currentColor" stroke-width="0.5"/>
        <line x1="110" y1="30" x2="130" y2="30" stroke="currentColor" stroke-width="0.5"/>
      </g>
    </pattern>
  </defs>
  <rect width="200" height="60" fill="url(#academic)"/>
</svg>
