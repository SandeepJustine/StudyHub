<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <pattern id="edu-icons" x="0" y="0" width="120" height="120" patternUnits="userSpaceOnUse">
      <!-- Pencil -->
      <g transform="translate(10, 10) rotate(-20)" opacity="0.08">
        <rect x="0" y="3" width="18" height="3" rx="0.5" fill="currentColor"/>
        <polygon points="18,1.5 22,4.5 18,7.5" fill="currentColor"/>
      </g>
      <!-- Book -->
      <g transform="translate(50, 8)" opacity="0.08">
        <path d="M0 5 L10 2 L20 5 L20 20 L10 17 L0 20Z" fill="none" stroke="currentColor" stroke-width="1"/>
        <line x1="10" y1="2" x2="10" y2="17" stroke="currentColor" stroke-width="0.5"/>
      </g>
      <!-- Lightbulb -->
      <g transform="translate(85, 10)" opacity="0.08">
        <circle cx="10" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="7" y="15" width="6" height="3" rx="1" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <line x1="10" y1="2" x2="10" y2="0" stroke="currentColor" stroke-width="0.5"/>
      </g>
      <!-- Calculator -->
      <g transform="translate(10, 50)" opacity="0.08">
        <rect x="0" y="0" width="16" height="22" rx="2" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="2" y="3" width="12" height="4" rx="0.5" fill="currentColor" opacity="0.3"/>
        <circle cx="4.5" cy="10" r="1.5" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <circle cx="8" cy="10" r="1.5" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <circle cx="11.5" cy="10" r="1.5" fill="none" stroke="currentColor" stroke-width="0.5"/>
      </g>
      <!-- Globe -->
      <g transform="translate(55, 55)" opacity="0.08">
        <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1"/>
        <ellipse cx="12" cy="12" rx="5" ry="10" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <line x1="2" y1="12" x2="22" y2="12" stroke="currentColor" stroke-width="0.5"/>
        <line x1="12" y1="2" x2="12" y2="22" stroke="currentColor" stroke-width="0.5"/>
      </g>
      <!-- Trophy -->
      <g transform="translate(85, 55)" opacity="0.08">
        <path d="M4 18 L6 2 L14 2 L16 18" fill="none" stroke="currentColor" stroke-width="1"/>
        <path d="M4 18 Q10 22 16 18" fill="none" stroke="currentColor" stroke-width="1"/>
        <rect x="1" y="18" width="18" height="3" rx="0.5" fill="none" stroke="currentColor" stroke-width="0.8"/>
        <path d="M6 2 Q3 5 3 8 Q3 11 6 12" fill="none" stroke="currentColor" stroke-width="0.5"/>
        <path d="M14 2 Q17 5 17 8 Q17 11 14 12" fill="none" stroke="currentColor" stroke-width="0.5"/>
      </g>
      <!-- Microscope -->
      <g transform="translate(10, 90)" opacity="0.08">
        <rect x="2" y="10" width="3" height="15" rx="0.5" fill="currentColor"/>
        <rect x="0" y="22" width="7" height="3" rx="0.5" fill="currentColor"/>
        <circle cx="12" cy="8" r="5" fill="none" stroke="currentColor" stroke-width="1"/>
        <line x1="5" y1="10" x2="8" y2="8" stroke="currentColor" stroke-width="0.8"/>
      </g>
      <!-- Beaker -->
      <g transform="translate(55, 95)" opacity="0.08">
        <path d="M5 20 L7 10 L13 10 L15 20" fill="none" stroke="currentColor" stroke-width="1"/>
        <line x1="4" y1="20" x2="16" y2="20" stroke="currentColor" stroke-width="0.8"/>
        <line x1="8" y1="14" x2="12" y2="14" stroke="currentColor" stroke-width="0.5"/>
        <circle cx="10" cy="17" r="1.5" fill="currentColor" opacity="0.2"/>
      </g>
      <!-- Atom/Molecule -->
      <g transform="translate(85, 90)" opacity="0.08">
        <circle cx="10" cy="10" r="2" fill="currentColor" opacity="0.3"/>
        <ellipse cx="10" cy="10" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(0)"/>
        <ellipse cx="10" cy="10" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(60)"/>
        <ellipse cx="10" cy="10" rx="10" ry="4" fill="none" stroke="currentColor" stroke-width="0.8" transform="rotate(120)"/>
      </g>
    </pattern>
  </defs>
  <rect width="120" height="120" fill="url(#edu-icons)"/>
</svg>
